# 此个人实例由所有者明确授权 main push 自动部署；见 docs/personal-deployment.md。
# 只使用既有资源和线上密钥，不创建资源、不重新初始化管理员。
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks and build only; skip D1 migration and publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flaremo-personal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'xiaohu65/FlareMo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and write this instance's configuration
        env:
          WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
        run: |
          node ./scripts/personal-deploy-check.mjs config
          node ./scripts/write-wrangler-config.mjs

      - name: Format and type checks
        run: |
          pnpm format:check
          pnpm check

      - name: Deployment script tests
        run: >-
          node --test
          ./scripts/personal-deploy-check.test.mjs
          ./scripts/provision-cloudflare.test.mjs
          ./scripts/write-wrangler-config.test.mjs
          ./scripts/smoke-check.test.mjs

      - name: Verify existing resources and authentication secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm provision:remote -- --check
          pnpm exec wrangler d1 migrations list DB --remote --config ./wrangler.jsonc
          node ./scripts/personal-deploy-check.mjs secrets

      - name: Confirm the existing instance is initialized
        run: node ./scripts/personal-deploy-check.mjs smoke

      - name: Build and deployment dry run
        run: pnpm deploy:dry-run

      - name: Deploy
        if: ${{ inputs.dry_run != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy

      - name: Smoke check deployed site
        if: ${{ inputs.dry_run != true }}
        run: |
          pnpm smoke:check
          node ./scripts/personal-deploy-check.mjs smoke
